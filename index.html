<body class="theme-dark">

  <span class="blob blob-d"></span>
  <span class="noise"></span>
</div>

<div id="device">
  <div id="app">

    <main id="views">

      <!-- ================= HOME / LIST ================= -->
      <section class="view active" id="view-home">
        <header class="topbar">
          <div class="topbar-txt">
            <span class="eyebrow" id="greeting">我的学习空间</span>
            <h1>Noteee<span class="dot">.</span></h1>
          </div>
          <div class="topbar-acts">
            <button class="icon-btn" id="btnStats" aria-label="统计" title="统计"><svg class="icon"><use href="#i-chart"/></svg></button>
            <button class="icon-btn" id="btnTheme" aria-label="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
          </div>
        </header>

        <div class="home-tools">
          <div class="glass searchbar">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="searchInput" type="search" placeholder="搜索题干、解析、错因…" autocomplete="off">
            <button class="search-clear" id="searchClear" aria-label="清空"><svg class="icon"><use href="#i-x"/></svg></button>
          </div>
          <button class="icon-btn" id="btnBatch" aria-label="批量导入错题" title="批量导入"><svg class="icon"><use href="#i-upload"/></svg></button>
          <button class="icon-btn filter-btn" id="btnFilter" aria-label="筛选"><svg class="icon"><use href="#i-filter"/></svg><span class="badge" id="filterBadge" hidden>0</span></button>
        </div>

        <div class="chip-row" id="activeFilterChips"></div>

        <div class="list-meta">
          <span id="listCount">全部错题</span>
          <button class="text-btn" id="btnSort"><svg class="icon"><use href="#i-sort"/></svg><span id="sortLabel">最新录入</span></button>
        </div>

        <div class="scroll" id="homeScroll">
          <div id="listBody" class="card-list"></div>
          <div class="scroll-pad"></div>
        </div>
      </section>

      <!-- ================= STATS ================= -->
      <section class="view" id="view-stats">
        <header class="topbar">
          <div class="topbar-txt"><span class="eyebrow">数据回顾</span><h1>统计<span class="dot">.</span></h1></div>
          <div class="hdr-spacer"></div>
        </header>
        <div class="scroll" id="statsScroll">
          <div id="statsBody"></div>
          <div class="scroll-pad"></div>
        </div>
      </section>

      <!-- ================= PDF / LOCAL DOCS / NOVELS ================= -->
      <section class="view" id="view-pdf">
        <header class="topbar">
          <div class="topbar-txt"><span class="eyebrow">离线资料</span><h1>资料<span class="dot">.</span></h1></div>
          <div class="hdr-spacer"></div>
        </header>
        <div class="doc-tabs-wrap">
          <div class="segmented doc-tabs" id="docTabs">
            <button class="on" data-doctab="docs">资料</button>
            <button data-doctab="novels">小说</button>
          </div>
        </div>
        <div class="scroll" id="docsScroll">
          <div id="pdfViewBody"></div>
          <div id="novelViewBody" hidden></div>
          <div class="scroll-pad"></div>
        </div>
      </section>

      <!-- ================= MANAGE ================= -->
      <section class="view" id="view-manage">
        <header class="topbar">
          <div class="topbar-txt"><span class="eyebrow">分类维护</span><h1>管理<span class="dot">.</span></h1></div>
          <div class="hdr-spacer"></div>
        </header>
        <div class="scroll" id="manageScroll">
          <div id="manageBody"></div>
          <div class="scroll-pad"></div>
        </div>
      </section>

      <!-- ================= SETTINGS ================= -->
      <section class="view" id="view-settings">
        <header class="topbar">
          <div class="topbar-txt"><span class="eyebrow">偏好与数据</span><h1>设置<span class="dot">.</span></h1></div>
          <div class="hdr-spacer"></div>
        </header>
        <div class="scroll" id="settingsScroll">
          <div id="settingsBody"></div>
          <div class="scroll-pad"></div>
        </div>
      </section>
    </main>

    <!-- ================= TAB BAR ================= -->
    <nav class="tabbar" id="tabbar">
      <div class="tabbar-glass"></div>
      <button class="tab active" data-view="home"><svg class="icon"><use href="#i-list"/></svg><span>错题</span></button>
      <button class="tab" data-view="pdf"><svg class="icon"><use href="#i-pdf"/></svg><span>资料</span></button>
      <div class="fab-slot"><button class="fab" id="btnAdd" aria-label="录入错题"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      <button class="tab" data-view="manage"><svg class="icon"><use href="#i-layers"/></svg><span>管理</span></button>
      <button class="tab" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></button>
    </nav>

    <input type="file" id="pdfFileInput" accept=".pdf,application/pdf" hidden>
    <input type="file" id="htmlFileInput" accept=".html,.htm,text/html" hidden>
    <input type="file" id="txtFileInput" accept=".txt,text/plain" hidden>

    <div id="overlayRoot"></div>
    <div id="toastRoot"></div>
  </div>
</div>

<script src="js/version.js"></script>
<script src="js/utils.js"></script>
<script src="js/zip.js"></script>
<script src="js/db.js"></script>
<script src="js/vision.js"></script>
<script src="js/batch.js"></script>
<script src="js/pdf.js"></script>
<script src="js/novel.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
