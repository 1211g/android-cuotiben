# Android build flags (no androidx / no third-party dependencies).
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true

# Gradle daemon JVM. Gradle 8.7 + AGP 8.5.2 support JDK 17, NOT JDK 25:
# Android Studio's bundled JBR is 25.0.4 and Groovy 3.0.17 fails while
# compiling build scripts with "Unsupported class file major version 69".
# Pin the daemon (and therefore Android Studio builds) to JDK 17.
org.gradle.java.home=D:/AndroidBuild/zulu17
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.daemon=true

# NOTE: the JDK above is a copy of the workspace .toolchain Zulu17 placed
# outside the workspace, because executables launched from inside the
# workspace cannot write to ~/.gradle/native (native-platform.dll.lock
# "Access is denied"). The copy has unrestricted file access.
